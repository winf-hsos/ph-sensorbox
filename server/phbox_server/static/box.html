<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pH-Sensorbox</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1 data-t="title">pH-Sensorbox</h1>
    <nav><a href="/" data-t="overview">Übersicht</a><a href="/admin" data-t="admin">Verwaltung</a></nav>
    <button id="lang">EN</button>
  </header>
  <main>
    <section class="card">
      <h2 id="name"><span class="dot"></span></h2>
      <div class="muted" id="where"></div>
      <div class="ph" id="ph">– <small>pH</small></div>
      <div class="row" id="values"></div>
    </section>

    <section>
      <div class="toolbar">
        <span data-t="range">Zeitraum</span>
        <select id="range">
          <option value="1">1 h</option>
          <option value="6" selected>6 h</option>
          <option value="24">24 h</option>
          <option value="168">7 d</option>
        </select>
        <span style="flex:1"></span>
        <span data-t="export">Export</span>
        <a id="csv" href="#">CSV</a>
        <a id="json" href="#">JSON</a>
      </div>
      <div class="card"><canvas id="phChart"></canvas></div>
      <div class="card" style="margin-top:12px"><canvas id="tempChart"></canvas></div>
    </section>

    <section>
      <h2 data-t="calibrations">Kalibrierungen</h2>
      <div id="cals" class="card"></div>
    </section>
  </main>
  <script src="/static/app.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get("id");
    let box = null, rows = [];

    function since() {
      const hours = +document.getElementById("range").value;
      return new Date(Date.now() - hours * 3600e3).toISOString().slice(0, 19) + "Z";
    }

    function renderHead() {
      if (!box) return;
      const last = rows.at(-1) || box.last;
      document.title = `${box.name || box.id} – ${t("title")}`;
      document.getElementById("name").innerHTML =
        `<span class="dot ${contactState(box)}"></span>${esc(box.name || box.id)} <span class="muted">${esc(box.id)}</span>`;
      document.getElementById("where").textContent = box.location || "";
      document.getElementById("ph").innerHTML = `${fmt.ph(last?.ph)} <small>pH</small>`;
      const cal = last && last.calibration_id != null;
      document.getElementById("values").innerHTML = `
        <span>${t("temperature")}: ${fmt.temp(last?.temp_c)}</span>
        <span>${t("voltage")}: ${fmt.mv(last?.mv)}</span>
        <span class="tag ${cal ? "" : "uncal"}">${t(cal ? "calibrated" : "uncalibrated")}</span>
        <span class="muted">${t("lastContact")}: ${fmt.ago(box.last_seen)}</span>`;
    }

    function renderCharts() {
      const gap = 3 * box.sample_interval_s * 1000;
      drawChart(document.getElementById("phChart"),
        rows.map((r) => [new Date(r.t), r.ph]), { label: "pH", digits: 2, maxGap: gap, minSpan: 0.2 });
      drawChart(document.getElementById("tempChart"),
        rows.filter((r) => r.temp_c != null).map((r) => [new Date(r.t), r.temp_c]),
        { label: `${t("temperature")} [°C]`, digits: 1, maxGap: gap, minSpan: 1 });
    }

    function renderCals() {
      const el = document.getElementById("cals");
      if (!box.calibrations.length) { el.innerHTML = `<span class="muted">${t("noCalibrations")}</span>`; return; }
      el.innerHTML = `<table><tr><th>${t("time")}</th><th>${t("probe")}</th><th>${t("points")}</th>
        <th>${t("slope")}</th><th>${t("offset")}</th></tr>` +
        box.calibrations.slice().reverse().map((c) => `<tr><td>${fmt.time(c.t)}</td><td>${esc(c.probe || "–")}</td>
          <td>${c.points.map((p) => `pH ${p[0]}: ${p[1].toFixed(1)} mV, ${p[2].toFixed(1)} °C`).join("<br>")}</td>
          <td>${c.slope_mv_per_ph.toFixed(1)} mV/pH (${c.slope_percent} %)</td>
          <td>${c.offset_mv.toFixed(1)} mV</td></tr>`).join("") + "</table>";
    }

    function renderAll() { renderHead(); renderCharts(); renderCals(); }

    async function load() {
      box = await api(`/api/v1/boxes/${encodeURIComponent(id)}`);
      const query = `start=${since()}`;
      rows = await api(`/api/v1/boxes/${encodeURIComponent(id)}/readings?${query}`);
      document.getElementById("csv").href = `/api/v1/boxes/${encodeURIComponent(id)}/readings?${query}&format=csv`;
      document.getElementById("json").href = `/api/v1/boxes/${encodeURIComponent(id)}/readings?${query}`;
      renderAll();
    }

    initPage(() => box && renderAll());
    document.getElementById("range").addEventListener("change", load);
    window.addEventListener("resize", () => box && renderCharts());
    load().catch((e) => { document.querySelector("main").innerHTML = `<div class="empty">${esc(e.message)}</div>`; });
    live({
      reading(r) {
        if (r.box !== id || !box) return;
        rows.push(r);
        box.last_seen = new Date().toISOString();
        renderHead();
        renderCharts();
      },
    });
    setInterval(() => box && renderHead(), 10000);
  </script>
</body>
</html>
