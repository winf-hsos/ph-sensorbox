<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pH-Sensorbox</title>
  <script>try { const theme = localStorage.getItem("theme"); if (theme) document.documentElement.dataset.theme = theme; } catch {}</script>
  <link rel="preload" href="/static/fonts/instrument-sans-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="wrap">
    <p class="lede" id="lede">&nbsp;</p>
    <div class="tiles" id="tiles"></div>
  </main>
  <script src="/static/app.js"></script>
  <script>
    initPage("overview");
    document.title = t("brand");
    const boxes = new Map();
    const tiles = new Map();

    function tile(box) {
      const name = h("div", { class: "tile-name", style: `view-transition-name: ${vtName("name", box.id)}` });
      const status = h("span", { class: "status" });
      const where = h("div", { class: "tile-where" });
      const value = h("div", { class: "readout", style: `view-transition-name: ${vtName("ph", box.id)}` });
      const temp = h("b"), mv = h("b");
      const facts = h("div", { class: "facts" },
        h("div", {}, temp), h("div", {}, mv));
      const bar = scale(null);
      bar.style.viewTransitionName = vtName("scale", box.id);
      const when = h("span"), cal = h("span", { class: "tag" });
      const el = h("a", { class: "tile", href: `/box?id=${encodeURIComponent(box.id)}` },
        h("div", { class: "tile-head" }, name, status),
        where,
        h("div", { class: "tile-reading" }, value, facts),
        bar,
        h("div", { class: "tile-foot" }, when, cal));
      return { el, name, status, where, value, temp, mv, bar, when, cal };
    }

    function update(box, fresh = false) {
      const view = tiles.get(box.id) ?? tiles.set(box.id, tile(box)).get(box.id);
      const last = box.last, state = contactState(box);
      view.name.textContent = box.name || box.id;
      view.where.textContent = box.location || "";
      view.status.dataset.state = state;
      view.status.textContent = t(state);
      readout(view.value, last?.ph);
      view.temp.textContent = fmt.temp(last?.temp_c);
      view.mv.textContent = fmt.mv(last?.mv);
      setScale(view.bar, last?.ph);
      view.when.textContent = `${t("lastReading")} ${fmt.ago(last?.t)}`;
      const calibrated = last && last.calibration_id != null;
      view.cal.dataset.kind = calibrated ? "cal" : "uncal";
      view.cal.textContent = t(calibrated ? "calibrated" : "uncalibrated");
      if (fresh) flash(view.value);
      return view.el;
    }

    function render() {
      const list = [...boxes.values()];
      const liveCount = list.filter((b) => contactState(b) === "live").length;
      document.getElementById("lede").textContent = !list.length ? t("ledeNone")
        : liveCount === list.length ? t("ledeAll", list.length) : t("ledeSome", list.length, liveCount);
      const container = document.getElementById("tiles");
      if (!list.length) {
        container.replaceChildren(h("div", { class: "empty" },
          h("p", {}, t("emptyTitle")), h("p", { class: "muted" }, t("emptyBody")), h("a", { href: "/admin" }, t("emptyLink"))));
        return;
      }
      container.replaceChildren(...list.map((b) => update(b)));
    }

    async function load() {
      const list = await api("/api/v1/boxes");
      boxes.clear();
      for (const box of list) boxes.set(box.id, box);
      render();
    }

    load();
    live({
      reading(r) {
        const box = boxes.get(r.box);
        if (!box) return load();
        box.last = r;
        box.last_seen = new Date().toISOString();
        update(box, true);
        render();
      },
      box: () => load(),
    }, load);
    setInterval(render, 10000); // keeps "last reading" and the status current
  </script>
</body>
</html>
