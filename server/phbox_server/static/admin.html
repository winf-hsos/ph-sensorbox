<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pH-Sensorbox</title>
  <script>try { const theme = localStorage.getItem("theme"); if (theme) document.documentElement.dataset.theme = theme; } catch {}</script>
  <link rel="preload" href="/static/fonts/instrument-sans-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="wrap">
    <div class="title-row">
      <p class="lede" id="title"></p>
      <button class="button" type="button" id="logout"></button>
    </div>

    <section class="block" id="pendingBlock" hidden>
      <h2 id="pendingTitle"></h2>
      <p class="muted" id="pendingHint"></p>
      <div class="table-wrap"><table id="pending" class="stack"></table></div>
    </section>

    <section class="block">
      <h2 id="boxesTitle"></h2>
      <div class="table-wrap"><table id="boxes" class="stack"></table></div>
    </section>

    <section class="block">
      <h2 id="calTitle"></h2>
      <p class="muted" id="calHint"></p>
      <div id="calForm"></div>
    </section>
  </main>
  <script src="/static/app.js"></script>
  <script>
    initPage("admin");
    document.title = `${t("admin")} – ${t("brand")}`;
    const $ = (sel) => document.getElementById(sel);
    $("title").textContent = t("admin");
    $("pendingTitle").textContent = t("pendingTitle");
    $("pendingHint").textContent = t("pendingHint");
    $("boxesTitle").textContent = t("boxes");
    $("calTitle").textContent = t("addCalibration");
    $("calHint").textContent = t("calHint");

    let boxes = [];
    const BUFFERS = [4.01, 7.0, 10.01];

    async function patch(id, body) {
      await api(`/api/v1/boxes/${encodeURIComponent(id)}`, { method: "PATCH", body: JSON.stringify(body) });
      await load();
    }

    function renderPending() {
      const pending = boxes.filter((b) => b.status === "pending");
      $("pendingBlock").hidden = !pending.length;
      $("pending").replaceChildren(
        h("tr", {}, h("th", {}, "ID"), h("th", {}, "Firmware"), h("th", {}, t("lastReading")), h("th", {})),
        ...pending.map((b) => h("tr", {},
          h("td", { "data-label": "ID" }, h("b", {}, b.id)), h("td", { "data-label": "Firmware" }, b.firmware || "–"),
          h("td", { "data-label": t("lastReading") }, fmt.ago(b.last_seen)),
          h("td", { class: "wide" }, h("div", { class: "row-actions" },
            h("button", { class: "button primary", type: "button", onclick: () => patch(b.id, { status: "approved" }) }, t("approve")),
            h("button", { class: "button danger", type: "button", onclick: () => patch(b.id, { status: "blocked" }) }, t("block")))))));
    }

    function renderBoxes() {
      const known = boxes.filter((b) => b.status !== "pending");
      $("boxes").replaceChildren(
        h("tr", {}, h("th", {}, "ID"), h("th", {}, t("status")), h("th", {}, t("name")), h("th", {}, t("location")),
          h("th", {}, t("sampleInterval")), h("th", {}, t("uploadInterval")), h("th", {})),
        ...known.map((b) => {
          const fields = {
            name: h("input", { class: "field", value: b.name ?? "", "aria-label": t("name") }),
            location: h("input", { class: "field", value: b.location ?? "", "aria-label": t("location") }),
            sample_interval_s: h("input", { class: "field num", type: "number", min: 1, value: b.sample_interval_s, "aria-label": t("sampleInterval") }),
            upload_interval_s: h("input", { class: "field num", type: "number", min: 5, value: b.upload_interval_s, "aria-label": t("uploadInterval") }),
          };
          const save = () => patch(b.id, {
            name: fields.name.value, location: fields.location.value,
            sample_interval_s: Number(fields.sample_interval_s.value), upload_interval_s: Number(fields.upload_interval_s.value),
          });
          return h("tr", {},
            h("td", { "data-label": "ID" }, b.id, h("div", { class: "muted" }, b.firmware || "")),
            h("td", { "data-label": t("status") }, h("span", { class: "status", "data-state": b.status === "approved" ? contactState(b) : "none" }, t(b.status))),
            h("td", { class: "wide", "data-label": t("name") }, fields.name),
            h("td", { class: "wide", "data-label": t("location") }, fields.location),
            h("td", { style: "width:120px", "data-label": t("sampleInterval") }, fields.sample_interval_s),
            h("td", { style: "width:120px", "data-label": t("uploadInterval") }, fields.upload_interval_s),
            h("td", { class: "wide" }, h("div", { class: "row-actions" },
              h("button", { class: "button", type: "button", onclick: save }, t("save")),
              b.status === "blocked"
                ? h("button", { class: "button", type: "button", onclick: () => patch(b.id, { status: "approved" }) }, t("unblock"))
                : h("button", { class: "button danger", type: "button", onclick: () => patch(b.id, { status: "blocked" }) }, t("block")))));
        }));
    }

    // Built once, so values typed into it survive live updates of the tables.
    const cal = {
      box: h("select", { class: "field", "aria-label": t("box") }),
      probe: h("input", { class: "field", "aria-label": t("probe") }),
      rows: BUFFERS.map((ph) => ({
        ph: h("input", { class: "field num", type: "number", step: "0.01", value: ph, "aria-label": t("bufferPh") }),
        mv: h("input", { class: "field num", type: "number", step: "0.1", "aria-label": t("voltage") }),
        temp: h("input", { class: "field num", type: "number", step: "0.1", "aria-label": t("temperature") }),
      })),
      message: h("p", { class: "message", role: "status" }),
    };

    async function useCurrent(row) {
      const fresh = (await api("/api/v1/admin/boxes")).find((b) => b.id === cal.box.value);
      if (!fresh?.last) return;
      row.mv.value = fresh.last.mv.toFixed(1);
      row.temp.value = fresh.last.temp_c?.toFixed(2) ?? "";
    }

    async function saveCalibration() {
      const points = cal.rows.map((r) => [r.ph.value, r.mv.value, r.temp.value])
        .filter((p) => p.every((v) => v !== "")).map((p) => p.map(Number));
      try {
        const result = await api(`/api/v1/boxes/${encodeURIComponent(cal.box.value)}/calibrations`,
          { method: "POST", body: JSON.stringify({ probe: cal.probe.value || null, points }) });
        cal.message.textContent = t("calSaved", `${fmt.number(result.slope_mv_per_ph, 1)} mV/pH (${fmt.number(result.slope_percent, 1)} %)`, fmt.mv(result.offset_mv));
      } catch (error) {
        cal.message.textContent = error.message;
      }
    }

    $("calForm").append(
      h("div", { class: "controls" },
        h("label", {}, t("box"), " ", cal.box),
        h("label", { style: "flex:1; min-width:220px" }, t("probe"), " ", cal.probe)),
      h("div", { class: "table-wrap" }, h("table", { class: "stack" },
        h("tr", {}, h("th", {}, t("bufferPh")), h("th", {}, `${t("voltage")} (mV)`), h("th", {}, `${t("temperature")} (°C)`), h("th", {})),
        ...cal.rows.map((r) => h("tr", {}, h("td", { "data-label": t("bufferPh") }, r.ph),
          h("td", { "data-label": `${t("voltage")} (mV)` }, r.mv), h("td", { "data-label": `${t("temperature")} (°C)` }, r.temp),
          h("td", { class: "wide" }, h("button", { class: "button", type: "button", onclick: () => useCurrent(r) }, t("useCurrent"))))))),
      h("div", { class: "controls" },
        h("button", { class: "button primary", type: "button", onclick: saveCalibration }, t("saveCalibration")), cal.message));

    function renderCalBoxes() {
      const current = cal.box.value;
      const approved = boxes.filter((b) => b.status === "approved");
      cal.box.replaceChildren(...approved.map((b) => h("option", { value: b.id }, b.name || b.id)));
      if (approved.some((b) => b.id === current)) cal.box.value = current;
      if (!approved.length) cal.message.textContent = t("noApproved");
    }

    async function load() {
      try {
        boxes = await api("/api/v1/admin/boxes");
      } catch (error) {
        if (error.status === 401) location.href = "/login"; // session expired
        throw error;
      }
      renderPending();
      renderBoxes();
      renderCalBoxes();
    }

    $("logout").textContent = t("logout");
    $("logout").addEventListener("click", async () => {
      await api("/api/v1/logout", { method: "POST" });
      location.href = "/";
    });

    load();
    live({ box: () => load() }, load);
  </script>
</body>
</html>
